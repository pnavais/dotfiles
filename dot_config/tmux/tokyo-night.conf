# Tokyo Night theme configuration
set -g @plugin "janoamaral/tokyo-night-tmux"

# Move status bar on top
set-option -g status-position top

# Tokyo Night theme configuration
set -g @tokyo-night-tmux_theme storm     # storm | day | default to 'night'
set -g @tokyo-night-tmux_transparent 0

set -g @tokyo-night-tmux_window_id_style digital # hide, none, digital, roman, fsquare, hsquare, dsquare, super, sub
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style hide

set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 

set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative # 'relative' or 'full'

set -g @tokyo-night-tmux_show_hostname 1

# tmux-dark-notify sources this file directly, so apply the plugin after its options.
run-shell 'bash "$HOME/.config/tmux/plugins/tokyo-night-tmux/tokyo-night.tmux"'
