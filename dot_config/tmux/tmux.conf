# General
# -------

# don't rename windows automatically
set-option -g allow-rename off

# enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Passthrough for OSC 52 (Clipboard on remote shell)
set -g set-clipboard on
set -g allow-passthrough on

# Alacritty
set -as terminal-features ",alacritty:RGB"

# Windows Terminal (via WSL) reports xterm-256color and doesn't advertise
# true color on its own terminfo entry, so grant it explicitly.
set -as terminal-features ",xterm-256color:RGB"

# Keybindings
# -----------

# Reload config
unbind r
bind r source-file "~/.config/tmux/tmux.conf" \; display "Config reloaded!"

# Secondary prefix
set -g prefix2 C-a
bind-key C-a send-prefix -2

# Fix home/end keys
bind -n End send-key C-e
bind -n Home send-key C-a

# Move through panes with vim motions
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R

# Join panes horizontal / vertically
bind v choose-window 'join-pane -h -s "%%"'
bind V choose-window 'join-pane -s "%%"'

# Keep current path for new windows
bind c new-window -c "#{pane_current_path}"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

# Resize the current pane using Alt + direction
bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# Synchronize all panes in a window
bind y setw synchronize-panes

# Swap current pane with the next one
bind > swap-pane -D

# Swap current pane with the previous one 
bind < swap-pane -U

# Toggle mouse
bind m run 'awk "/^#[[:space:]]+Functions/{f=1;next} f&&c++" ${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf | cut -c3- | sh -s _toggle_mouse'

# Window Management
# -----------------

# Make window/pane index start with 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable mouse
setw -g mouse on

# Plugins
# -------
# List of plugins
set -g @plugin 'erikw/tmux-dark-notify'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Load current theme configuration
#source-file "~/.config/tmux/theme.conf"
set -g @dark-notify-theme-path-light "$HOME/.config/tmux/theme-light.conf"
set -g @dark-notify-theme-path-dark "$HOME/.config/tmux/theme-dark.conf"

# Initialize TMUX plugin manager before applying the selected theme.
run '~/.tmux/plugins/tpm/tpm'

# Apply the theme selected by tmux-dark-notify after TPM has loaded plugins.
# The symlink is persisted so startup does not depend on the notifier's runner
# winning a race with tmux initialization.
if-shell "test -e ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
  "source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf"

